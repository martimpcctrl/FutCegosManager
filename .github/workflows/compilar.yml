name: Compilar App

# Roda automaticamente a cada push, e também pode ser disparado manualmente
# pela aba "Actions" do repositório.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Rodar os testes (JUnit)
        run: ./gradlew test --stacktrace

      - name: Compilar o APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Disponibilizar os relatórios de teste (mesmo se algum falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          retention-days: 14
